[package]
name = "gas-deployment"
version = "0.1.0"
description = "Devnet-only GAS weekly deployment records"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "gas_deployment"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
